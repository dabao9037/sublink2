name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest==8.4.2
      - run: PYTHONPATH=. pytest -q
      - run: bash -n install.sh
      - name: Native service contract
        run: |
          grep -Fq '/usr/local/bin/sub' install.sh
          grep -Fq 'sublink2.service' install.sh
          grep -Fq 'systemctl enable' install.sh
      - name: Native low-privilege permission and HTTP smoke
        run: |
          sudo useradd --system --user-group --home-dir /nonexistent --shell /usr/sbin/nologin sublink2-smoke
          trap 'sudo userdel sublink2-smoke || true' EXIT
          sudo SUBLINK2_SMOKE_USER=sublink2-smoke ./tests/native_low_privilege_smoke.sh
